<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  
  />

  <title>Snake Game</title>

  <link
    rel="stylesheet"
    href="style.css"
  />

</head>

<body>

  <div id="topBar">

    <label>Mode:</label>

    <select id="levelSelect">

      <option value="1">
        Easy
      </option>

      <option value="2">
        Medium
      </option>

      <option value="3">
        Impossible
      </option>

    </select>

    <button id="startButton">
      Start
    </button>

  </div>

  <canvas
    id="game"
    width="600"
    height="600"
  ></canvas>

  <script src="script.js"></script>

</body>
