<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Snake Game</title>

  <link
    rel="stylesheet"
    href="style.css"
  />

</head>

<body>

  <div id="topBar">

    <label>Mode:</label>

    <select id="levelSelect">

      <option value="1">
        Easy
      </option>

      <option value="2">
        Medium
      </option>

      <option value="3">
        Impossible
      </option>

    </select>

    <button id="musicToggle">Play Music</button>
    <button id="musicStyleToggle">Switch to Bubbly Dream</button>

  </div>

  <canvas
    id="game"
    width="750"
    height="750"
  ></canvas>

  <div id="endOverlay">
    <div class="panel">
      <div id="endMessage">Click Start to play</div>
      <div id="endStats"></div>
      <button id="actionButton">Start</button>
    </div>
  </div>

  <img
    id="background"
    src="images/background.png"
    style="display:none;"
  />

  <script src="script.js"></script>

</body>

</html>
